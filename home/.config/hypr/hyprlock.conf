# =====================================================
# WALLTHEME — GENERATED HYPRLOCK CONFIG
#
# DO NOT EDIT THIS FILE.
#
# Current wallpaper is managed through:
# ~/.config/walltheme/current-wallpaper
#
# Generated from:
# ~/.config/walltheme/current.json
# =====================================================


# =====================================================
# BACKGROUND
# =====================================================

background {
    monitor =
    path = ~/.config/walltheme/current-wallpaper

    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}


# =====================================================
# INPUT FIELD
# =====================================================

input-field {
    monitor =

    size = 250, 60

    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(100, 180, 180, 1.0)
    inner_color = rgba(16, 20, 22, 0.82)

    font_color = rgb(242, 244, 242)

    rounding = -1

    check_color = rgb(216, 199, 97)
    fail_color = rgb(240, 90, 90)

    placeholder_text = Input Password...

    position = 0, -150
    halign = center
    valign = center
}


# =====================================================
# DATE
# =====================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%A, %B %d")"

    color = rgba(175, 183, 181, 0.75)

    font_size = 22
    font_family = JetBrains Mono

    position = 0, 150
    halign = center
    valign = center
}


# =====================================================
# TIME
# =====================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%-I:%M")"

    color = rgba(242, 244, 242, 0.9)

    font_size = 90
    font_family = JetBrains Mono

    position = 0, 50
    halign = center
    valign = center
}
